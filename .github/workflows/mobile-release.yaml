name: Android Release
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    tags:
      - "mobile-v*.*.*"

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      APP_VARIANT: production
      EXPO_PUBLIC_SERVER_URL: ${{ vars.MOBILE_SERVER_URL }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mobile source
        run: |
          pnpm --dir apps/mobile lint
          pnpm --dir apps/mobile typecheck

      - name: Restore Android upload key
        env:
          MOBILE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$MOBILE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/relay-upload.jks"
          chmod 600 "$RUNNER_TEMP/relay-upload.jks"

      - name: Generate native Android project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build signed APK
        working-directory: apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_RELAY_UPLOAD_STORE_FILE: ${{ runner.temp }}/relay-upload.jks
          ORG_GRADLE_PROJECT_RELAY_UPLOAD_STORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELAY_UPLOAD_KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELAY_UPLOAD_KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --max-workers=2 --no-parallel
          '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8'
          :app:assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./apps/mobile/app.json").expo.version')
          apk="$RUNNER_TEMP/Relay-mobile-$version.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --latest=false \
            --title "Relay Mobile $version" \
            --notes "Signed Android APK for direct installation."
