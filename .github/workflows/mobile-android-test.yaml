name: Mobile Android Test Build

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Staging or production API URL embedded in the app"
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_SERVER_URL: ${{ inputs.server_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint mobile app
        run: pnpm --dir apps/mobile lint

      - name: Typecheck mobile app
        run: pnpm --dir apps/mobile typecheck

      - name: Generate Android project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease
        working-directory: apps/mobile/android

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk_path="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path"

          mkdir -p dist
          artifact_stem="Relay-Android-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cp "$apk_path" "dist/${artifact_stem}.apk"
          sha256sum "dist/${artifact_stem}.apk" > "dist/${artifact_stem}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: relay-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-assets

      - name: Create prerelease and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path=$(find release-assets -type f -name '*.apk' -print -quit)
          checksum_path=$(find release-assets -type f -name '*.apk.sha256' -print -quit)
          test -n "$apk_path"
          test -n "$checksum_path"

          release_tag="mobile-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$release_tag" "$apk_path" "$checksum_path" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Relay Android test ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Android test build from commit ${GITHUB_SHA}." \
            --prerelease
