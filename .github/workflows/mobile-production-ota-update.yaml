name: Mobile Android Production OTA Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Short description shown in EAS Update"
        required: true
        type: string
      rollout_percentage:
        description: "Percentage of eligible production users that receive the update"
        required: true
        default: 100
        type: number

permissions: {}

concurrency:
  group: mobile-android-production-update
  cancel-in-progress: false

jobs:
  update:
    name: Publish production update
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CI: "true"
      ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
      UPDATE_MESSAGE: ${{ inputs.message }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint mobile app
        run: pnpm --dir apps/mobile lint

      - name: Typecheck mobile app
        run: pnpm --dir apps/mobile typecheck

      - name: Validate rollout percentage
        shell: bash
        run: |
          set -euo pipefail
          test "$ROLLOUT_PERCENTAGE" -ge 1
          test "$ROLLOUT_PERCENTAGE" -le 100

      - name: Verify OTA-capable release configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { expo } = require('./apps/mobile/app.json');
          const projectId = '31611b11-e654-4010-b20a-78d4bcb6dbba';
          if (expo.extra?.eas?.projectId !== projectId || expo.owner !== 'prajwal-17' || expo.slug !== 'relay') {
            throw new Error('Mobile app must be linked to the Relay EAS project');
          }
          if (expo.updates?.url !== `https://u.expo.dev/${projectId}` || expo.updates?.requestHeaders?.['expo-channel-name'] !== 'production') {
            throw new Error('Mobile app must use the production EAS Update channel');
          }
          if (expo.runtimeVersion?.policy !== 'appVersion') {
            throw new Error('Mobile updates must use the appVersion runtime policy');
          }
          if (!require('./apps/mobile/package.json').dependencies['expo-updates']) {
            throw new Error('expo-updates is required in the APK');
          }
          NODE
          version=$(node -p 'require("./apps/mobile/app.json").expo.version')
          gh release view "mobile-v$version" --json isDraft --jq .isDraft | grep -qx false || {
            echo "Publish and install OTA-capable mobile-v$version APK before sending an update." >&2
            exit 1
          }

      - name: Verify production environment
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas env:exec
          production
          'test -n "$EXPO_PUBLIC_SERVER_URL"'
          --non-interactive

      - name: Ensure production update channel
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! eas channel:view production --non-interactive >/dev/null 2>&1; then
            eas channel:create production --non-interactive
          fi

      - name: Publish Android production update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas update
          --channel production
          --environment production
          --platform android
          --message "$UPDATE_MESSAGE"
          --rollout-percentage "$ROLLOUT_PERCENTAGE"
          --non-interactive
