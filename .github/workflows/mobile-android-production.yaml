name: Mobile Android GitHub Release

on:
  push:
    tags:
      - "mobile-v*.*.*"

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_SERVER_URL: ${{ vars.MOBILE_SERVER_URL }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Check release configuration
        run: |
          node <<'NODE'
          const { expo } = require('./apps/mobile/app.json');
          const expectedTag = `mobile-v${expo.version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Tag must match app.json version: ${expectedTag}`);
          }
          if (expo.android.package !== 'com.prajwal17.relay') {
            throw new Error('Keep the existing Android package ID com.prajwal17.relay');
          }
          if (!Number.isInteger(expo.android.versionCode) || expo.android.versionCode < 1) {
            throw new Error('Set a positive android.versionCode in apps/mobile/app.json');
          }
          const url = new URL(process.env.EXPO_PUBLIC_SERVER_URL);
          if (url.protocol !== 'https:') {
            throw new Error('Set the MOBILE_SERVER_URL repository variable to the deployed HTTPS Worker origin');
          }
          NODE

      - name: Check backend is reachable
        run: |
          curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 15 \
            "${EXPO_PUBLIC_SERVER_URL%/}/health" | \
            node -e 'let body = ""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => { const health = JSON.parse(body); if (health.service !== "relay-server" || health.status !== "ok") process.exit(1); });'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mobile source
        run: |
          pnpm --dir apps/mobile lint
          pnpm --dir apps/mobile typecheck

      - name: Restore Android upload key
        env:
          MOBILE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
          MOBILE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          MOBILE_ANDROID_KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          MOBILE_ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
        run: |
          for name in MOBILE_ANDROID_KEYSTORE_BASE64 MOBILE_ANDROID_KEYSTORE_PASSWORD MOBILE_ANDROID_KEY_ALIAS MOBILE_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$MOBILE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/relay-upload.jks"
          chmod 600 "$RUNNER_TEMP/relay-upload.jks"

      - name: Generate native Android project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build signed APK
        working-directory: apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_RELAY_UPLOAD_STORE_FILE: ${{ runner.temp }}/relay-upload.jks
          ORG_GRADLE_PROJECT_RELAY_UPLOAD_STORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELAY_UPLOAD_KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELAY_UPLOAD_KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify and stage release files
        run: |
          version=$(node -p 'require("./apps/mobile/app.json").expo.version')
          mkdir -p release
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "release/Relay-mobile-$version.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          "$apksigner" verify "release/Relay-mobile-$version.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(node -p 'require("./apps/mobile/app.json").expo.version')
          apk="release/Relay-mobile-$version.apk"
          if gh release view "$tag" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]; then
              echo "Release $tag is already published; refusing to replace its binaries." >&2
              exit 1
            fi
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --verify-tag --draft --latest=false \
              --title "Relay Mobile $version" \
              --notes "Signed Android APK for direct installation."
          fi
          gh release edit "$tag" --draft=false --latest=false
