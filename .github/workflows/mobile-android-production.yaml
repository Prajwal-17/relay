name: Mobile Android GitHub Release

on:
  push:
    tags:
      - "mobile-v*.*.*"

permissions: {}

concurrency:
  group: mobile-android-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    permissions:
      contents: write
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint mobile app
        run: pnpm --dir apps/mobile lint

      - name: Typecheck mobile app
        run: pnpm --dir apps/mobile typecheck

      - name: Verify release configuration
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app_version=$(node -p "require('./apps/mobile/app.json').expo.version")
          package_id=$(node -p "require('./apps/mobile/app.json').expo.android.package")
          expected_tag="mobile-v${app_version}"
          test -n "$app_version"
          test "$package_id" = "com.prajwal17.relay"
          if [ "$PUSHED_TAG" != "$expected_tag" ]; then
            echo "::error::Pushed tag ${PUSHED_TAG} does not match expo.version in apps/mobile/app.json (expected ${expected_tag})."
            exit 1
          fi
          if gh release view "$PUSHED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${PUSHED_TAG} already exists."
            exit 1
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$PUSHED_TAG" >> "$GITHUB_OUTPUT"
          echo "Building Relay ${app_version} (${package_id})"

      - name: Verify production environment
        working-directory: apps/mobile
        run: >-
          eas env:exec
          production
          'test -n "$EXPO_PUBLIC_SERVER_URL"'
          --non-interactive

      - name: Build signed production APK
        id: build
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          build_result="$RUNNER_TEMP/eas-build.json"
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > "$build_result"

          build_id=$(jq -r 'if type == "array" then .[0].id else .id end' "$build_result")
          test -n "$build_id"
          test "$build_id" != "null"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Download production APK
        id: download
        shell: bash
        working-directory: apps/mobile
        env:
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/relay-android-production"
          build_details="$RUNNER_TEMP/eas-build-details.json"
          mkdir -p "$download_dir"
          eas build:view "$BUILD_ID" --json > "$build_details"

          build_url=$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' "$build_details")
          apk_path="$download_dir/Relay-${APP_VERSION}-${BUILD_ID}.apk"
          test -n "$build_url"
          curl --fail --location --silent --show-error --retry 3 "$build_url" --output "$apk_path"
          test -s "$apk_path"
          sha256sum "$apk_path" > "${apk_path}.sha256"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          APK_PATH: ${{ steps.download.outputs.apk_path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$APK_PATH" \
            "${APK_PATH}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Relay Android ${APP_VERSION}" \
            --notes ""
