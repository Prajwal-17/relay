appId: com.relay-dev.app
productName: Relay-Dev
extraMetadata: # injects properties into package.json
  name: relay-dev
  desktopName: relay-dev
directories:
  buildResources: ../../assets/desktop
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
extraResources:
  - from: drizzle/
    to: drizzle/
    filter:
      - "**/*"
  - from: ../../assets/desktop/icon.png
    to: relay-icon.png
win:
  executableName: Relay-Dev
  icon: icon.ico
nsis:
  artifactName: "${productName}-${version}.${ext}"
  shortcutName: "${productName}"
  uninstallDisplayName: "${productName}"
  createDesktopShortcut: always
mac:
  icon: icon.icns
linux:
  executableName: relay-dev
  icon: icon.png
  syncDesktopName: true
  target:
    - AppImage
    - deb
  maintainer: prajwalkreddy17@gmail.com
  category: Office
appImage:
  artifactName: "${productName}-${version}.${ext}"
deb:
  artifactName: "${productName}-${version}.${ext}"
npmRebuild: false
publish:
  provider: github
  owner: Prajwal-17
  repo: pos
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
